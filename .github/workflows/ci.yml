name: CI

# 推 main / PR 时跑一遍完整检查；publish.yml 用 workflow_call 复用同一份，发布前不会再漏一步。
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm 的版本不在 workflow 里写死：action-setup 读 package.json 的 packageManager，与本地
      # 用同一个版本。它必须排在 setup-node 前面——下面的 cache: pnpm 要靠它算 store 路径。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # 与 engines 的下限一致：不会无意中依赖更高版本的 Node。
          node-version: 22.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 先按本包自己的接口定义生成编解码文件（typecheck / test 也会各自生成一遍，不依赖这一步的产物）。
      - run: pnpm run generate

      # 宿主端与浏览器端是两个 tsconfig：这一步同时覆盖「语法能否解析」与「类型是否自洽」。
      - run: pnpm run typecheck

      # 产物必须真的出得来——tsdown 不做类型检查，所以它与 typecheck 是两件独立的事。
      - run: pnpm run build

      # 行为测试：宿主事件源、投递、声音、Service Worker、Windows 通知与产物契约。
      - run: pnpm test

      # 包进宿主时缺了什么，只有过一遍 npm 自己的打包器才看得见。依赖 lib/ 存在，放在 build 之后。
      - run: pnpm run check:package
