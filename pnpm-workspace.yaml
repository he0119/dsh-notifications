# 本仓库只有一个包，这里没有 `packages:` —— 这个文件只承载 pnpm 的设置（pnpm 10+ 起，pnpm 自己的
# 设置以 pnpm-workspace.yaml 为准）。
#
# nodeLinker: hoisted
#   pnpm 默认的 isolated 布局靠 junction/symlink 组织依赖树；在 Windows 沙箱下实测这种布局会让
#   `@deepseek-ai/cordis` 的运行时依赖解析失败（Cannot find package '@deepseek-ai/cosmokit'）。
#   hoisted 生成扁平的真实目录，不依赖任何链接。
#
#   ⚠️ 本机实测：pnpm 会忽略这个设置，布局仍是 isolated。因此在本机安装依赖请用
#   `npm install --no-package-lock`（见 docs/development.md 的「本机安装」）；这条设置留给能识别它
#   的 pnpm，CI 就是这样。
nodeLinker: hoisted

# 供应链策略的放行名单。
#
# pnpm 11 默认拦住发布不满 24 小时的版本：连 `--frozen-lockfile` 也会逐条验锁文件，命中就
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION（CI 上就是这条）。本包跟着 DSH 的 0.2.2-rc.2 这一代走，
# 而它今天才发布，所以这一代的每条都按版本精确放行。等过了 24 小时窗口，整段可以删掉。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.2-rc.2'
  - '@deepseek-ai/dsh-agent-default-model@0.2.2-rc.2'
  - '@deepseek-ai/dsh-agent-loop@0.2.2-rc.2'
