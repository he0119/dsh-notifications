# pnpm 10+ 默认拦住自带安装/构建脚本的依赖，命中时连 `pnpm run` 的依赖检查都会失败。本仓库的依赖里
# 只有 koffi 带构建脚本：它是 `@deepseek-ai/dsh-fs-local` 的原生绑定，随测试用的 DSH 开发依赖带进来，
# 本包的源码与测试都不 import 它。放行它的构建，安装过程才不会在 CI 上停在这一条。
allowBuilds:
  koffi: true
